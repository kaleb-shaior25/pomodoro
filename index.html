<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temporizador de Descansos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#354024">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* palette: botanical / zen — moss, kombu, tan, bone, café noir */
    --bg-1: #2d3920;
    --bg-2: #161b0f;
    --surface: #354024;
    --surface-2: #475230;
    --border: #4c5936;
    --text: #e9ddc8;
    --text-dim: #a99a78;
    --accent: #9aa46f;
    --accent-dim: #3a4227;
    --break: #d4bd96;
    --break-dim: #473c29;
    --font-display: 'Playfair Display', serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-body: 'Inter', system-ui, sans-serif;
    /* layout: single centered panel, big digital readout, controls below */
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background: radial-gradient(ellipse 120% 80% at 50% -10%, var(--bg-1) 0%, var(--bg-2) 70%);
    color: var(--text);
    font-family: var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    width:100%;
    max-width:460px;
    background: var(--surface);
    border:1px solid var(--border);
    border-radius:22px;
    padding:28px 28px 24px;
    box-shadow: 0 24px 70px -24px rgba(10,8,2,0.75);
    transition: border-color .4s ease, box-shadow .4s ease;
  }
  .app[data-mode="break"]{
    border-color: #5c4f38;
  }

  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 22px;
  }
  .label-pill{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 100px;
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid rgba(154,164,111,0.3);
    transition: all .3s ease;
  }
  .app[data-mode="break"] .label-pill{
    background: var(--break-dim);
    color: var(--break);
    border-color: rgba(212,189,150,0.35);
  }
  .cycle-count{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  .clock-wrap{
    text-align:center;
    padding: 18px 0 8px;
  }
  .clock{
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 58px;
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    transition: color .3s ease;
  }
  .app[data-mode="break"] .clock{ color: var(--break); }
  .app[data-mode="work"] .clock{ color: var(--accent); }

  .state-line{
    margin-top: 10px;
    font-size: 14px;
    color: var(--text-dim);
    min-height: 20px;
  }

  .ring{
    position: relative;
    width: 268px;
    height: 268px;
    margin: 0 auto 4px;
  }
  .ring svg{ transform: rotate(-90deg); width:100%; height:100%; }
  .ring-track{ stroke: var(--surface-2); fill:none; stroke-width: 6; }
  .ring-progress{
    fill:none; stroke-width: 6; stroke-linecap: round;
    stroke: var(--accent);
    transition: stroke-dashoffset .3s linear, stroke .3s ease;
  }
  .app[data-mode="break"] .ring-progress{ stroke: var(--break); }
  .ring-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }

  .controls{
    display:flex;
    gap:10px;
    margin-top: 22px;
  }
  button{
    font-family: var(--font-body);
    font-weight:600;
    font-size: 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 13px 16px;
    cursor: pointer;
    transition: all .15s ease;
  }
  button:hover{ border-color: #5e6c40; }
  button:active{ transform: scale(0.97); }
  button:focus-visible{ outline: 2px solid var(--accent); outline-offset:2px; }

  .btn-primary{
    flex: 1.4;
    background: var(--accent);
    border-color: var(--accent);
    color: #1c200f;
    font-size: 15px;
  }
  .btn-primary:hover{ filter: brightness(1.08); }
  .app[data-mode="break"] .btn-primary{
    background: var(--break);
    border-color: var(--break);
    color: #231d10;
  }
  .btn-secondary{ flex: 1; }
  .btn-skip{ flex: 1; }

  .settings{
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .setting-group label{
    display:block;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    cursor:pointer;
  }
  .chip.active{
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .app[data-mode="break"] .chip.active{
    background: var(--break-dim);
    border-color: var(--break);
    color: var(--break);
  }

  .foot-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 14px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .alarm-row{
    display:flex;
    align-items:center;
    gap: 10px;
    flex: 1;
  }
  .bell-btn{
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 50%;
    background: var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .bell-btn:hover{ background: var(--accent-dim); }
  .app[data-mode="break"] .bell-btn:hover{ background: var(--break-dim); }
  .bell-icon{

    height: 17px;

  .app[data-mode="break"] .bell-icon{ background-color: var(--break); }

  .volume-control{
    flex: 1;
    display:flex;
    flex-direction:column;
    gap: 4px;
    min-width: 0;
  }
  .volume-control label{
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .volume-control input[type="range"]{
    width: 100%;
    accent-color: var(--accent);
    height: 16px;
    cursor: pointer;
  }
  .app[data-mode="break"] .volume-control input[type="range"]{ accent-color: var(--break); }

  .toggle-line{
    display:flex;
    align-items:center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
    cursor:pointer;
    user-select:none;
    white-space: nowrap;
  }
  .toggle-line input{ accent-color: var(--accent); width:15px; height:15px; cursor:pointer; }

  .disabled, button:disabled{ opacity:0.45; cursor:not-allowed; }

  .perm-note{
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display:none;
  }
  .perm-note.show{ display:block; }
  .perm-note a{ color: var(--accent); cursor:pointer; text-decoration: underline; }

  @keyframes flash{
    0%, 100% { background: var(--surface); }
    50% { background: var(--surface-2); }
  }
  .flash{ animation: flash 0.6s ease 3; }
</style>
</head>
<body>

<div class="app" id="app" data-mode="work">
  <div class="top">
    <span class="label-pill" id="modeLabel">Trabajo</span>
    <span class="cycle-count" id="cycleCount">Ciclo 1</span>
  </div>

  <div class="clock-wrap">
    <div class="ring">
      <svg viewBox="0 0 220 220">
        <circle class="ring-track" cx="110" cy="110" r="100"></circle>
        <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100"
          stroke-dasharray="628.3" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-center">
        <div class="clock" id="clock">60:00</div>
      </div>
    </div>
    <div class="state-line" id="stateLine">Listo para empezar</div>
  </div>

  <div class="controls">
    <button class="btn-primary" id="startBtn">Iniciar</button>
    <button class="btn-skip" id="skipBtn">Saltar</button>
    <button class="btn-secondary" id="resetBtn">Reiniciar</button>
  </div>

  <div class="settings">
    <div class="setting-group">
      <label>Trabajo (min)</label>
      <div class="chip-row" id="workChips">
        <div class="chip" data-val="25">25</div>
        <div class="chip" data-val="45">45</div>
        <div class="chip active" data-val="60">60</div>
        <div class="chip" data-val="90">90</div>
      </div>
    </div>
    <div class="setting-group">
      <label>Descanso (min)</label>
      <div class="chip-row" id="breakChips">
        <div class="chip" data-val="5">5</div>
        <div class="chip" data-val="10">10</div>
        <div class="chip active" data-val="15">15</div>
        <div class="chip" data-val="20">20</div>
      </div>
    </div>
  </div>

  <div class="foot-row">
    <div class="alarm-row">
      <button type="button" class="bell-btn" id="bellBtn" title="Probar alarma" aria-label="Probar alarma">
        <span class="bell-icon"></span>

<script>
(function(){
  const CIRC = 2 * Math.PI * 100;

  const el = {
    app: document.getElementById('app'),
    clock: document.getElementById('clock'),
    modeLabel: document.getElementById('modeLabel'),
    cycleCount: document.getElementById('cycleCount'),
    stateLine: document.getElementById('stateLine'),
    ring: document.getElementById('ringProgress'),
    startBtn: document.getElementById('startBtn'),
    skipBtn: document.getElementById('skipBtn'),
    resetBtn: document.getElementById('resetBtn'),
    workChips: document.getElementById('workChips'),
    breakChips: document.getElementById('breakChips'),
    bellBtn: document.getElementById('bellBtn'),
    volumeSlider: document.getElementById('volumeSlider'),
    notifToggle: document.getElementById('notifToggle'),
    permNote: document.getElementById('permNote'),
    alarmAudio: document.getElementById('alarmAudio'),
  };

  el.ring.setAttribute('stroke-dasharray', CIRC.toFixed(1));

  // ---- persisted settings (per-browser convenience only) ----
  let saved = {};
  try{
    saved = JSON.parse(localStorage.getItem('pomo-settings') || '{}');
  }catch(e){ saved = {}; }

  const state = {
    mode: 'work',               // 'work' | 'break'
    workMin: saved.workMin || 60,
    breakMin: saved.breakMin || 15,
    running: false,
    endTime: null,              // timestamp when current phase ends
    remainingMs: null,          // used when paused
    cycle: 1,
    volume: saved.volume !== undefined ? saved.volume : 70,
    notifOn: saved.notifOn !== undefined ? saved.notifOn : true,
  };

  el.volumeSlider.value = state.volume;
  el.notifToggle.checked = state.notifOn;
  setActiveChip(el.workChips, state.workMin);
  setActiveChip(el.breakChips, state.breakMin);

  function setActiveChip(container, val){
    [...container.children].forEach(c=>{
      c.classList.toggle('active', Number(c.dataset.val) === Number(val));
    });
  }

  function persist(){
    try{
      localStorage.setItem('pomo-settings', JSON.stringify({
        workMin: state.workMin, breakMin: state.breakMin,
        volume: state.volume, notifOn: state.notifOn
      }));
    }catch(e){}
  }

  function totalMsForMode(mode){
    return (mode === 'work' ? state.workMin : state.breakMin) * 60 * 1000;
  }

  function fmt(ms){
    const total = Math.max(0, Math.ceil(ms/1000));
    const m = Math.floor(total/60);
    const s = total%60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  // ---- alarm sound: custom recorded clip, played via <audio> ----
  function warmupAudio(){
    // unlocks playback on this element so the later programmatic
    // play() at phase-end (no fresh user gesture) is allowed
    try{
      const p = el.alarmAudio.play();
      if(p && p.then){
        p.then(()=>{ el.alarmAudio.pause(); el.alarmAudio.currentTime = 0; }).catch(()=>{});
      } else {
        el.alarmAudio.pause();
        el.alarmAudio.currentTime = 0;
      }
    }catch(e){}
  }

  function playAlarm(){
    if(state.volume <= 0) return;
    try{
      el.alarmAudio.currentTime = 0;
      el.alarmAudio.volume = Math.max(0, Math.min(1, state.volume/100));
      const p = el.alarmAudio.play();
      if(p && p.catch) p.catch(()=>{});
    }catch(e){}
  }

  function notify(title, body){
    if(!state.notifOn) return;
    if(!('Notification' in window)) return;
    if(Notification.permission === 'granted'){
      try{ new Notification(title, {body}); }catch(e){}
    }
  }

  function requestNotifPermission(){
    if(!('Notification' in window)) return;
    if(Notification.permission === 'default'){
      Notification.requestPermission().then(p=>{
        el.permNote.classList.toggle('show', p === 'denied' && state.notifOn);
      });
    } else if(Notification.permission === 'denied'){
      el.permNote.classList.toggle('show', state.notifOn);
    }
  }

  // ---- rendering ----
  function render(remainingMs){
    const total = totalMsForMode(state.mode);
    const frac = Math.max(0, Math.min(1, remainingMs/total));
    el.clock.textContent = fmt(remainingMs);
    el.ring.setAttribute('stroke-dashoffset', (CIRC * (1-frac)).toFixed(1));
    document.title = fmt(remainingMs) + ' · ' + (state.mode==='work' ? 'Trabajo' : 'Descanso');
  }

  function setMode(mode, opts){
    opts = opts || {};
    state.mode = mode;
    el.app.setAttribute('data-mode', mode);
    el.modeLabel.textContent = mode === 'work' ? 'Trabajo' : 'Descanso';
    el.cycleCount.textContent = 'Ciclo ' + state.cycle;
    if(!opts.silent){
      el.app.classList.remove('flash');
      requestAnimationFrame(()=> el.app.classList.add('flash'));
    }
  }

  function startPhaseTimer(ms){
    state.endTime = Date.now() + ms;
    state.remainingMs = null;
  }

  function tick(){
    if(!state.running) return;
    const remaining = state.endTime - Date.now();
    if(remaining <= 0){
      finishPhase();
      return;
    }
    render(remaining);
  }

  function finishPhase(){
    const finishedMode = state.mode;
    if(finishedMode === 'work'){
      playAlarm();
      notify('Hora de un descanso', state.breakMin + ' minutos. Suelta el teclado.');
      el.stateLine.textContent = 'Descanso en curso — vuelve en ' + state.breakMin + ' min';
      setMode('break');
    } else {
      playAlarm();
      notify('De vuelta al trabajo', 'Arranca el siguiente bloque de ' + state.workMin + ' min.');
      state.cycle += 1;
      el.stateLine.textContent = 'Bloque de trabajo en curso';
      setMode('work');
    }
    startPhaseTimer(totalMsForMode(state.mode));
    render(totalMsForMode(state.mode));
  }

  let intervalId = null;
  function startInterval(){
    if(intervalId) return;
    intervalId = setInterval(tick, 250);
  }
  function stopInterval(){
    clearInterval(intervalId);
    intervalId = null;
  }

  function start(){
    warmupAudio();
    requestNotifPermission();

    if(!state.running){
      state.running = true;
      if(state.remainingMs != null){
        startPhaseTimer(state.remainingMs);
      } else if(!state.endTime){
        startPhaseTimer(totalMsForMode(state.mode));
      }
      startInterval();
      el.startBtn.textContent = 'Pausar';
      el.stateLine.textContent = state.mode === 'work' ? 'Bloque de trabajo en curso' : 'Descanso en curso';
    } else {
      state.running = false;
      state.remainingMs = Math.max(0, state.endTime - Date.now());
      stopInterval();
      el.startBtn.textContent = 'Reanudar';
      el.stateLine.textContent = 'Pausado';
    }
  }

  function reset(){
    state.running = false;
    stopInterval();
    state.cycle = 1;
    state.remainingMs = null;
    state.endTime = null;
    setMode('work', {silent:true});
    render(totalMsForMode('work'));
    el.startBtn.textContent = 'Iniciar';
    el.stateLine.textContent = 'Listo para empezar';
    document.title = 'Temporizador de Descansos';
  }

  function skip(){
    const wasRunning = state.running;
    stopInterval();
    state.running = false;
    finishPhase();
    if(wasRunning){
      state.running = true;
      startInterval();
      el.startBtn.textContent = 'Pausar';
    } else {
      state.remainingMs = totalMsForMode(state.mode);
      el.startBtn.textContent = 'Iniciar';
    }
  }

  // ---- wire up controls ----
  el.startBtn.addEventListener('click', start);
  el.resetBtn.addEventListener('click', reset);
  el.skipBtn.addEventListener('click', skip);

  el.workChips.addEventListener('click', (e)=>{
    const chip = e.target.closest('.chip');
    if(!chip) return;
    state.workMin = Number(chip.dataset.val);
    setActiveChip(el.workChips, state.workMin);
    persist();
    if(state.mode === 'work' && !state.running){
      state.remainingMs = null; state.endTime = null;
      render(totalMsForMode('work'));
    }
  });
  el.breakChips.addEventListener('click', (e)=>{
    const chip = e.target.closest('.chip');
    if(!chip) return;
    state.breakMin = Number(chip.dataset.val);
    setActiveChip(el.breakChips, state.breakMin);
    persist();
    if(state.mode === 'break' && !state.running){
      state.remainingMs = null; state.endTime = null;
      render(totalMsForMode('break'));
    }
  });

  el.volumeSlider.addEventListener('input', ()=>{
    state.volume = Number(el.volumeSlider.value);
    persist();
  });

  el.bellBtn.addEventListener('click', ()=>{
    playAlarm();
  });

  el.notifToggle.addEventListener('change', ()=>{
    state.notifOn = el.notifToggle.checked;
    persist();
    if(state.notifOn) requestNotifPermission();
    else el.permNote.classList.remove('show');
  });

  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && state.running){
      tick();
    }
  });

  // initial paint
  render(totalMsForMode('work'));
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
